<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Activity Tracker Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background-color: #dcfce7;
      color: #15803d;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 14px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
    }
    .status-dot.disconnected {
      background-color: #ef4444;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-row {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background-color: #ffffff;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    .id-box {
      background-color: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
      color: #334155;
    }
    button {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.secondary {
      background-color: #e2e8f0;
      color: #334155;
    }
    button.secondary:hover {
      background-color: #cbd5e1;
    }
    .footer {
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
      margin-top: 14px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Local Activity Tracker</div>
    <div class="badge" id="enrollBadge">Enrolled</div>
  </div>

  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Checking connection...</span>
  </div>

  <div class="form-group">
    <label class="label" for="profileNameInput">Profile Name</label>
    <div class="input-row">
      <input type="text" id="profileNameInput" placeholder="e.g. Work, Personal" />
      <button id="saveNameBtn">Save</button>
    </div>
  </div>

  <div class="form-group">
    <label class="label">Profile ID</label>
    <div class="input-row">
      <div class="id-box" id="profileIdText">Loading...</div>
      <button class="secondary" id="copyIdBtn">Copy</button>
    </div>
  </div>

  <div class="footer">
    100% Local Storage &bull; No Remote Uploads &bull; Offline Active
  </div>

  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
